name: Mac and Linux

# WillowWallet for Mac and Linux (Flutter, from the same code as the Android app in mobile/, with a sidebar like the
# Windows app). Every push to main that touches mobile/ and manual runs build both. When main has a new version, the
# .dmg (Mac) and .AppImage/.tar.gz (Linux) are added to the GitHub Release v<version> that the Windows workflow publishes
# (all the apps share one version number).
on:
  push:
    branches: [main, hello-mac-linux]
    paths: ['mobile/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then release=true; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "WillowWallet for Linux $v (release: $release)"

      - name: Linux build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2 > /dev/null

      - name: Create the Linux project files
        run: |
          flutter create --platforms=linux --org com.bytehawkstudio --project-name coinpilot --no-pub . > /dev/null
          python3 tool/patch_native.py linux

      - run: flutter pub get

      - name: Build
        run: |
          flutter build linux --release
          ls build/linux/x64/release/bundle

      - name: Package (.tar.gz and .AppImage)
        run: |
          v=${{ steps.ver.outputs.version }}
          b=build/linux/x64/release/bundle
          mkdir -p dist
          tar -C "$b" -czf "dist/WillowWallet-$v-linux-x64.tar.gz" .
          app=build/AppDir
          rm -rf $app && mkdir -p $app
          cp -r $b/. $app/
          cp assets/coinpilot.png $app/willowwallet.png
          printf '[Desktop Entry]\nType=Application\nName=WillowWallet\nComment=Budgets, bills, debts and goals\nExec=willowwallet\nIcon=willowwallet\nCategories=Office;Finance;\nTerminal=false\n' > $app/willowwallet.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/willowwallet" "$@"\n' > $app/AppRun
          chmod +x $app/AppRun $app/willowwallet
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $app "dist/WillowWallet-$v-x86_64.AppImage"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: WillowWallet-Linux-${{ steps.ver.outputs.version }}
          path: mobile/dist/*

      - name: Add to the GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../tools/attach-to-release.sh "v${{ steps.ver.outputs.version }}" dist/*

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then release=true; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Create the Mac project files
        run: |
          flutter create --platforms=macos --org com.bytehawkstudio --project-name coinpilot --no-pub . > /dev/null
          python3 tool/patch_native.py macos
          # The app icon from the coin
          set=macos/Runner/Assets.xcassets/AppIcon.appiconset
          for s in 16 32 64 128 256 512 1024; do sips -z $s $s assets/coinpilot.png --out "$set/app_icon_$s.png" > /dev/null; done

      - run: flutter pub get

      - name: Build
        run: |
          flutter build macos --release
          ls build/macos/Build/Products/Release

      - name: Package (.dmg)
        run: |
          v=${{ steps.ver.outputs.version }}
          app=build/macos/Build/Products/Release/WillowWallet.app
          lipo -info "$app/Contents/MacOS/WillowWallet" || true
          mkdir -p dist dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "WillowWallet $v" -srcfolder dmg -ov -format UDZO "dist/WillowWallet-$v-macOS.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: WillowWallet-Mac-${{ steps.ver.outputs.version }}
          path: mobile/dist/*

      - name: Add to the GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../tools/attach-to-release.sh "v${{ steps.ver.outputs.version }}" dist/*
