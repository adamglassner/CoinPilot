name: Android smoke test
on:
  push:
    branches: [smoke]
  workflow_dispatch:
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download the released APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-v1.7.0 -R ${{ github.repository }} -p '*.apk' -O app.apk
      - name: Launch on an emulator and collect the log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.bytehawkstudio.coinpilot -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.bytehawkstudio.coinpilot || echo "NOT RUNNING"
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d > full.txt || true
            echo "===== CRASH BUFFER ====="; cat crash.txt
            echo "===== ERRORS ====="; grep -E " E |FATAL|AndroidRuntime|flutter" full.txt | tail -150
