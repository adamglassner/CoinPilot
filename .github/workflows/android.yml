name: Android

# WillowWallet for Android (formerly CoinPilot; Flutter, in mobile/).
# - Every push that touches mobile/ and manual runs: analyze, test, render screenshots, build the APK.
# - Push to main with a pubspec version that has no android-v<version> release yet: publish that release with the APK.
#   It is never marked "latest", so the Bytehawk Studio Launcher keeps installing the Windows app.
on:
  push:
    branches: [main, transactions-budgets]
    paths: ['mobile/**', 'server/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'server/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && ! git rev-parse -q --verify "refs/tags/android-v$v" >/dev/null; then release=true; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "WillowWallet for Android $v (release: $release)"
          flutter --version

      - name: Create the Android project files
        run: |
          flutter create --platforms=android --org com.bytehawkstudio --project-name coinpilot --no-pub . > /dev/null
          rm -f test/widget_test.dart.orig
          cp -r android-res/. android/app/src/main/res/
          python3 tool/patch_native.py android
          grep -nE 'android:label|uses-permission|Cleartext|Receiver' android/app/src/main/AndroidManifest.xml
          grep -nE 'minSdk|Desugaring|desugar' android/app/build.gradle.kts
          git status --short .

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Start a WillowWallet Server for the sync tests
        working-directory: .
        run: |
          dotnet build server/WillowWallet.Server/WillowWallet.Server.csproj -c Release -o "$RUNNER_TEMP/ww-server" | tail -3
          WW_DATA="$RUNNER_TEMP/ww-data" WW_ADMIN_USERNAME=admin WW_ADMIN_PASSWORD=android-test-admin \
            nohup "$RUNNER_TEMP/ww-server/WillowWalletServer" > "$RUNNER_TEMP/ww-server.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:8484/api/v1/info && break; sleep 1; done
          curl -sf http://localhost:8484/api/v1/info >/dev/null || { cat "$RUNNER_TEMP/ww-server.log"; exit 1; }
          echo "WW_TEST_SERVER=http://localhost:8484" >> "$GITHUB_ENV"
          echo "WW_TEST_ADMIN_PASSWORD=android-test-admin" >> "$GITHUB_ENV"

      - name: Tests
        run: flutter test test/logic_test.dart test/finance_test.dart test/forecast_test.dart test/insights_test.dart test/receipt_test.dart test/widget_test.dart test/sync_test.dart

      - name: Screenshots
        run: |
          flutter test --update-goldens test/screenshots_test.dart
          ls -la test/screenshots

      - name: Publish screenshots to the "screenshots-android" branch
        if: github.event_name != 'pull_request'
        working-directory: mobile/test/screenshots
        run: |
          git init -q -b screenshots-android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android screenshots of ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:screenshots-android

      - name: Build APK
        run: |
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      - name: Sign with the WillowWallet key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          out=build/WillowWallet-Android-${{ steps.ver.outputs.version }}.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/coinpilot.jks"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/coinpilot.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias coinpilot --out "$out" "$apk"
          else
            echo "::warning::No signing key secret; the APK keeps the build machine's debug signature"
            cp "$apk" "$out"
          fi
          "$tools/apksigner" verify --print-certs "$out" | head -3
          ls -la "$out"

      # The release build must actually start on Android (1.7.0 didn't: the shrinker removed a class it needs)
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Launch the APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          script: |
            adb install -r build/WillowWallet-Android-${{ steps.ver.outputs.version }}.apk
            adb logcat -c
            adb shell monkey -p com.bytehawkstudio.coinpilot -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d -b crash > "$RUNNER_TEMP/crash.txt" || true
            cat "$RUNNER_TEMP/crash.txt"
            adb shell pidof com.bytehawkstudio.coinpilot || (echo "::error::WillowWallet isn't running 25 seconds after launch" && exit 1)
            if grep -q "com.bytehawkstudio.coinpilot" "$RUNNER_TEMP/crash.txt"; then echo "::error::WillowWallet crashed on launch" && exit 1; fi
            echo "WillowWallet started and is running"

      - uses: actions/upload-artifact@v4
        with:
          name: WillowWallet-Android-${{ steps.ver.outputs.version }}
          path: mobile/build/WillowWallet-Android-*.apk

      - name: Publish the Android release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.ver.outputs.version }}
          gh release create "android-v$v" "build/WillowWallet-Android-$v.apk" \
            --target "$GITHUB_SHA" --latest=false \
            --title "WillowWallet for Android $v" \
            --notes "WillowWallet for Android $v. Download **WillowWallet-Android-$v.apk** on your phone and open it to install (allow installs from your browser or Files app when Android asks). Your data is saved on your phone, and can sync with WillowWallet for Windows through your own WillowWallet Server (Settings → Sync). See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/mobile/CHANGELOG.md)."
