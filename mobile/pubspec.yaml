name: coinpilot
description: WillowWallet for Android, Mac and Linux — budgets, bills, debts, goals and more. A Bytehawk Studio app.
publish_to: none
version: 1.6.1+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  cryptography: ^2.7.0
  http: ^1.2.2
  archive: ^3.6.1
  file_picker: ^10.3.3
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.1
  local_auth: ^3.0.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/coinpilot.png
    - CHANGELOG.md
    - CHANGELOG-desktop.md
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
